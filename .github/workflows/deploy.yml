name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo "Deploying ${GITHUB_SHA::7} to staging"

  prod:
    needs: staging
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://github.com/clouviq-labs/clouviq-app/pkgs/container/clouviq-app
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1
          mask-aws-account-id: true
      - name: Who am I in AWS?
        run: aws sts get-caller-identity
      - name: Deploy to prod
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "Token available: ${DEPLOY_TOKEN:+yes}"
          echo "Deploying ${GITHUB_SHA::7} to prod"
