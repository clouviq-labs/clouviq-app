name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push once
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}

  dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Deploy
        run: echo "Deploying $IMAGE to dev"
      - name: Smoke test
        run: |
          docker run -d -q -p 8080:8080 "$IMAGE"
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 localhost:8080/health
          echo "dev runs ${IMAGE#*@}" >> "$GITHUB_STEP_SUMMARY"

  staging:
    needs: [build, dev]
    runs-on: ubuntu-latest
    environment: staging
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Deploy
        run: echo "Deploying $IMAGE to staging"
      - name: Smoke test
        run: |
          docker run -d -q -p 8080:8080 "$IMAGE"
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 localhost:8080/health
          echo "staging runs ${IMAGE#*@}" >> "$GITHUB_STEP_SUMMARY"

  prod:
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://github.com/clouviq-labs/clouviq-app/pkgs/container/clouviq-app
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1
          mask-aws-account-id: true
      - name: Read the running task definition
        run: aws ecs describe-task-definition --task-definition clouviq-app --query taskDefinition > task-def.json
      - name: Swap in the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: task-def.json
          container-name: app
          image: ${{ env.IMAGE }}
      - name: Blue/green deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: clouviq-lab
          service: clouviq-app
          wait-for-service-stability: true
          wait-max-delay-seconds: 15
      - name: Summary
        run: echo "prod runs ${IMAGE#*@}" >> "$GITHUB_STEP_SUMMARY"
