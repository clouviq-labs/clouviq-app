name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push once
        id: push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

  dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Deploy
        run: echo "Deploying $IMAGE to dev"
      - name: Smoke test
        run: |
          docker run -d -q -p 8080:8080 "$IMAGE"
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 localhost:8080/health
          echo "dev runs ${IMAGE#*@}" >> "$GITHUB_STEP_SUMMARY"

  staging:
    needs: [build, dev]
    runs-on: ubuntu-latest
    environment: staging
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Deploy
        run: echo "Deploying $IMAGE to staging"
      - name: Smoke test
        run: |
          docker run -d -q -p 8080:8080 "$IMAGE"
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 localhost:8080/health
          echo "staging runs ${IMAGE#*@}" >> "$GITHUB_STEP_SUMMARY"

  prod:
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://github.com/clouviq-labs/clouviq-app/pkgs/container/clouviq-app
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1
          mask-aws-account-id: true
      - name: Deploy
        run: echo "Deploying $IMAGE to prod"
      - name: Smoke test
        run: |
          docker run -d -q -p 8080:8080 "$IMAGE"
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 localhost:8080/health
          echo "prod runs ${IMAGE#*@}" >> "$GITHUB_STEP_SUMMARY"
