name: Triage
on:
  issues:
    types: [opened]
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Log the new issue
        run: echo "New issue: ${{ github.event.issue.title }}"
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.issue.number,
              labels: ["triage"],
            });
