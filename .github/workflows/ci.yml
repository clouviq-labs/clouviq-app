name: CI
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    uses: clouviq-labs/shared-workflows/.github/workflows/python-lint.yml@v1
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.12"
        include:
          - os: ubuntu-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: clouviq-labs/shared-workflows/setup-app@v1
        with:
          python-version: ${{ matrix.python }}
      - run: pytest -q
  build:
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t clouviq-app .
